# PR validation: build the current upstream stable + run the smoke suite.
# Publishes nothing.
name: pull-request

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  test-build:
    name: Build & smoke (no publish)
    uses: ./.github/workflows/build.yml
    # Caller must grant the UNION of permissions any nested job declares.
    # build.yml's release job requests contents:write; GitHub validates that
    # at graph-resolve time even when publish:false skips the job.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      version: '2.79.0'
      commit: 'beba8b7e5e479f3d8b4d404e3e47cf4aaef4d936'
      publish: false
    secrets: inherit
