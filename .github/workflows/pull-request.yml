# PR validation: build the current upstream stable + run the smoke suite.
# Publishes nothing.
name: pull-request

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'compose.yaml'
      - 'docker-compose.yaml'

jobs:
  test-build:
    name: Build & smoke (no publish)
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: '2.54.0'
      commit: '979b005c219468903cff9c5cf3276eb15caad3fa'
      publish: false
    secrets: inherit
