# PR validation: build the current upstream stable + run the smoke suite.
# Publishes nothing.
name: pull-request

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'skills/**'
      - 'test/**'
      - '.github/workflows/**'

jobs:
  skill-sync:
    name: Report vendored skill drift (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require executable bit on shell scripts
        run: |
          set -euo pipefail
          bad="$(git ls-files -s -- 'scripts/*.sh' 'test/*.sh' | awk '$1 != "100755" { print }')"
          if [ -n "$bad" ]; then
            echo "These shell scripts must be mode 100755:" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
      - name: Offline latest-release regression
        run: bash test/sync-ocx-skill-latest-release.sh
      - name: Check vendored skill
        continue-on-error: true
        run: bash scripts/sync-ocx-skill.sh --check
  test-build:
    name: Build & smoke (no publish)
    uses: ./.github/workflows/build.yml
    # Caller must grant the UNION of permissions any nested job declares.
    # build.yml's release job requests contents:write; GitHub validates that
    # at graph-resolve time even when publish:false skips the job.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      version: '2.95.0'
      commit: '9df4f6a56483ffe62526e29c7d9c6eeed3e742f4'
      publish: false
    secrets: inherit
