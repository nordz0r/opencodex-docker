name: sync-ocx-skill

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ocx-skill-upstream-sync
  cancel-in-progress: false

jobs:
  propose-upstream-update:
    name: Propose safe upstream skill update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Sync against latest stable upstream release without overwriting local edits
        run: bash scripts/sync-ocx-skill.sh
      # Only propose a skill-update PR from main. workflow_dispatch on a
      # feature branch is for verifying the sync script and must not push
      # automation/sync-ocx-skill-upstream or open a PR against main.
      - name: Open or update pull request
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/sync-ocx-skill-upstream
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- skills/ocx)" ]; then
            echo "The vendored skill already matches upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- skills/ocx
          git commit -m "chore: sync OCX skill from upstream"
          expected=""
          if git fetch --quiet origin "refs/heads/$BRANCH"; then
            expected="$(git rev-parse FETCH_HEAD)"
            git push --force-with-lease="refs/heads/$BRANCH:$expected" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          pr_number="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore: sync OCX skill from upstream" \
              --body "Automated upstream skill update. Review the skill diff and confirm the MIT license notice before merging. The sync script refuses local conflicts instead of overwriting local changes."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync OCX skill from upstream" \
              --body "Automated upstream skill update. Review the skill diff and confirm the MIT license notice before merging. The sync script refuses local conflicts instead of overwriting local changes."
          fi
          # pull_request events caused by GITHUB_TOKEN stay action_required.
          # workflow_dispatch is the documented exception. The PR check list
          # shows only the newest check suite of a workflow per commit, so the
          # dispatch must start after the action_required pull_request run,
          # and that empty run is removed so it cannot hide the real checks.
          sha="$(git rev-parse HEAD)"
          runs_api="repos/$GITHUB_REPOSITORY/actions/workflows/pull-request.yml/runs"
          gated_run=""
          for _ in $(seq 1 24); do
            gated_run="$(gh api "$runs_api?event=pull_request&head_sha=$sha" \
              --jq '.workflow_runs[0].id // empty')"
            [ -n "$gated_run" ] && break
            sleep 5
          done
          gh workflow run pull-request.yml --ref "$BRANCH"
          if [ -n "$gated_run" ]; then
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$gated_run" --jq '.conclusion // empty')"
            if [ "$conclusion" = "action_required" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$gated_run"
              echo "Removed gated pull_request run $gated_run for $sha."
            fi
          else
            echo "No pull_request run for $sha after 120s; dispatched anyway." >&2
          fi
