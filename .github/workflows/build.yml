# Reusable build/test/publish pipeline for one verified upstream version.
# Called by check-upstream.yml (daily/manual detection) and pull-request.yml
# (build+smoke only, no publish).
name: build

on:
  workflow_call:
    inputs:
      version:
        description: 'Upstream version, e.g. 2.40.0 (no leading v)'
        required: true
        type: string
      commit:
        description: 'Immutable upstream commit SHA for tag vX.Y.Z'
        required: true
        type: string
      publish:
        description: 'Publish to registries + create Release (false = build & smoke only)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/opencodex
  DOCKERHUB_IMAGE: docker.io/nordz0r/opencodex

jobs:
  build:
    name: Build, smoke, scan, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # artifact attestation
      attestations: write    # artifact attestation
    outputs:
      image_ref: ${{ steps.refs.outputs.ghcr_primary }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify upstream tag and package.json version agreement
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          git ls-remote --exit-code https://github.com/lidge-jun/opencodex.git "refs/tags/v${version}" >/dev/null
          pkg="$(curl -fsSL "https://raw.githubusercontent.com/lidge-jun/opencodex/v${version}/package.json")"
          actual="$(printf '%s' "$pkg" | node -e "let r='';process.stdin.on('data',c=>r+=c).on('end',()=>process.stdout.write(JSON.parse(r).version))")"
          if [ "${actual}" != "${version}" ]; then
            echo "::error::package.json version ${actual} != tag version ${version}"
            exit 1
          fi
          echo "verified upstream v${version} @ ${{ inputs.commit }}"

      - name: Compute all image refs and tags
        id: refs
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          suffix="rc-${{ github.run_id }}"
          tags_list=""
          if [ '${{ inputs.publish }}' = 'true' ]; then
            tags_list="${version}|v${version}|${major}.${minor}|${major}|latest"
          else
            tags_list="rc-${version}-${suffix}"
          fi
          {
            echo "ghcr_primary=ghcr.io/nordz0r/opencodex:${version}"
            echo "tags<<EOF"
            printf '%s\n' ${tags_list//|/ } | while IFS= read -r tag; do
              echo "ghcr.io/nordz0r/opencodex:${tag}"
              echo "docker.io/nordz0r/opencodex:${tag}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Single-arch amd64 build first: smoke + scan must gate publishing.
      - name: Build amd64 for smoke/scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            UPSTREAM_VERSION=${{ inputs.version }}
            UPSTREAM_COMMIT=${{ inputs.commit }}
          tags: opencodex-smoke:amd64
          cache-from: type=gha,scope=ocx-${{ inputs.version }}
          cache-to: type=gha,mode=max,scope=ocx-${{ inputs.version }}

      - name: Smoke test (healthz, readyz, negative auth, non-root)
        run: bash scripts/smoke-test.sh opencodex-smoke:amd64

      - name: Trivy vulnerability scan (CRITICAL + fixable HIGH block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: opencodex-smoke:amd64
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: CRITICAL,HIGH

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: opencodex-smoke:amd64
          format: spdx-json
          artifact-name: sbom-opencodex-${{ inputs.version }}.spdx.json

      # Multi-arch push: exact tags only. Moving convenience tags are added by
      # a second push whose manifest inherits the same digest base; production
      # consumers always pin image@sha256:<digest>.
      - name: Push multi-arch image
        if: ${{ inputs.publish }}
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            UPSTREAM_VERSION=${{ inputs.version }}
            UPSTREAM_COMMIT=${{ inputs.commit }}
          tags: ${{ steps.refs.outputs.tags }}
          cache-from: type=gha,scope=ocx-${{ inputs.version }}
          cache-to: type=gha,mode=max,scope=ocx-${{ inputs.version }}

      - name: Artifact attestation for GHCR digest
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/nordz0r/opencodex
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with image digest evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const version = '${{ inputs.version }}';
            const commit = '${{ inputs.commit }}';
            const digest = '${{ needs.build.outputs.digest }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = [
              `Packaged upstream release: https://github.com/lidge-jun/opencodex/releases/tag/v${version}`,
              ``,
              `| Field | Value |`,
              `|---|---|`,
              `| Upstream version | \`${version}\` |`,
              `| Upstream commit | \`${commit}\` |`,
              `| Image (GHCR, immutable digest) | \`ghcr.io/${owner}/opencodex@${digest}\` |`,
              `| Image (Docker Hub) | \`nordz0r/opencodex:${version}\` |`,
              `| Platforms | linux/amd64, linux/arm64 |`,
              `| Smoke | /healthz, /readyz, anonymous /v1/catalog rejection, non-root UID |`,
              `| SBOM | SPDX (workflow artifact) |`,
              `| Attestation | \`gh attestation verify oci://ghcr.io/${owner}/opencodex@${digest} -R ${owner}/${repo}\` |`,
              ``,
              `Upstream changelog is not copied here; see the upstream release page.`
            ].join('\n');
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              body,
              target_commitish: context.sha,
              generate_release_notes: false,
            });
