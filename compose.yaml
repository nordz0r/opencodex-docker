name: opencodex

services:
  hub:
    # Moving tag: tracks the newest published upstream release (always == latest stable).
    # Production should prefer a pinned digest:
    # image: ghcr.io/nordz0r/opencodex@sha256:<digest>
    image: ghcr.io/nordz0r/opencodex:latest
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      OCX_SERVICE: "1"
      OPENCODEX_HOME: /home/bun/.opencodex
      # Dedicated Codex home (incompatible auth.json with OPENCODEX_HOME).
      CODEX_HOME: /home/bun/.codex
    ports:
      - "${OPENCODEX_BIND_ADDRESS:-127.0.0.1}:${OPENCODEX_PORT:-10100}:10100"
    volumes:
      - ocx-state:/home/bun/.opencodex
      - codex-state:/home/bun/.codex
      # Operator extras (not in upstream compose): persist CLI auth/state.
      - claude-state:/home/bun/.claude
      - grok-state:/home/bun/.grok
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    secrets:
      - source: ocx_api_token
        target: ocx_api_token
        uid: "1000"
        gid: "1000"
        mode: 0440
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  ocx-state:
  codex-state:
  claude-state:
  grok-state:

secrets:
  ocx_api_token:
    file: ./secrets/ocx_api_token
